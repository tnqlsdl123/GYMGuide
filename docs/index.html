<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>운동기구 찾기 | GYM GUIDE</title>
    <link rel="stylesheet" href="./css/guide.css">
    <script type="module" src="./js/catalog.js"></script>
</head>
<body>
<header class="site-header">
    <nav class="container header-inner" aria-label="메인 메뉴">
        <a class="brand" href="./">
            <span class="brand-mark" aria-hidden="true"><i class="dumbbell"></i></span>
            GYM GUIDE
        </a>
        <div class="nav-links">
            <a class="nav-link" href="./#equipment">운동기구 찾기</a>
            <a class="nav-link" href="./schedule.html">헬스장 이용 시간표</a>
        </div>
    </nav>
</header>
<main class="container">
    <section class="hero" aria-labelledby="hero-title">
        <div class="hero-content">
            <h1 id="hero-title">어떤 <span>운동기구</span>를 <br>찾고 있나요?</h1>
            <p>운동기구 사용법부터 자극 부위까지 한눈에 알아보세요.</p>
            <form class="search-form" action="./#equipment" method="get" role="search">
                <i class="search-icon" aria-hidden="true"></i>
                <label class="sr-only" for="keyword">운동기구 검색</label>
                <input id="keyword" type="search" name="q" placeholder="운동기구 이름 검색" autocomplete="off">
                <input type="hidden" name="category" disabled>
                <button class="clear-search" type="button" aria-label="검색어 지우기" hidden>×</button>
                <button class="search-submit" type="submit">검색</button>
            </form>
        </div>
        <img class="hero-image" src="./images/gym.webp" alt="" width="1200" height="800" fetchpriority="high">
    </section>

    <section class="gym-status" data-status="UNKNOWN" aria-labelledby="gym-status-title">
        <div>
            <div class="gym-status-heading">
                <h2 id="gym-status-title">오늘의 헬스장 이용 안내</h2>
                <span class="gym-state" role="status">확인 중</span>
            </div>
            <p class="gym-description">운영 시간과 수업 일정을 불러오는 중이에요.</p>
            <p class="gym-transition" hidden></p>
            <time class="gym-checked" hidden></time>
            <noscript><p>현재 이용 상태를 확인하려면 JavaScript를 켜 주세요.</p></noscript>
        </div>
        <a class="filter gym-schedule-link" href="./schedule.html">시간표 보기</a>
    </section>
    <section id="equipment" class="catalog" aria-labelledby="catalog-title">
        <div class="catalog-heading">
            <h2 id="catalog-title">운동기구 둘러보기</h2>
            <p>운동하고 싶은 부위를 선택해 보세요.</p>
        </div>
        <nav class="filters" aria-label="운동 부위별 필터" hidden></nav>
        <p class="result-count" role="status">운동기구 목록을 불러오는 중이에요.</p>
        <div class="catalog-grid" hidden></div>
        <div class="empty" hidden>
            <h3>조건에 맞는 운동기구가 없어요.</h3>
            <p>검색어를 바꾸거나 전체 운동기구를 살펴보세요.</p>
            <a class="filter" href="./#equipment">전체 운동기구 보기</a>
        </div>
        <noscript><p>운동기구 목록을 확인하려면 JavaScript를 켜 주세요.</p></noscript>
    </section>
    <template id="equipment-card">
        <article class="equipment-card">
            <a class="card-link">
                <div class="card-media">
                    <img alt="" width="700" height="456" loading="lazy" hidden>
                    <span>이미지 준비 중</span>
                </div>
                <div class="card-body">
                    <span class="category-tag"></span>
                    <h3></h3>
                    <p class="card-muscles"></p>
                    <p class="card-summary"></p>
                    <span class="card-cta" aria-hidden="true">사용법 보기 <i class="chevron"></i></span>
                </div>
            </a>
        </article>
    </template>
</main>
<footer class="site-footer">
    <div class="container footer-inner">
        <a class="brand footer-brand" href="./">GYM GUIDE</a>
        <span>운동기구 사용법 안내</span>
    </div>
</footer>
</body>
</html>
